<html lang="en">
  <head>
    <title>Add Hero | Female Super Hero Trading Cards</title>
    <script
      src="https://kit.fontawesome.com/8391330468.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat|Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="static/villain.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script type="text/javascript" src="static/addvillain.js"></script>
  </head>

  <body>
    <div class="header">
      <h1 class="pre-logo-title">Super Powered Hero Trading Card App©</h1>
      <a href="/" class="logo"
        ><img
          src="https://thumbs.dreamstime.com/b/hand-pressing-red-button-comic-style-red-background-hand-pressing-red-button-comic-book-style-surrounded-dynamic-327704773.jpg"
          alt="Home"
      /></a>
      <div class="header-right">
        <a href="/add"><i class="fas fa-plus"></i> add card</a>
        <a href="/delete"><i class="fas fa-times"> </i> remove card</a>
      </div>
    </div>
    <div class="content">
      <div class="form">
        <h2>ADD A CARD</h2>
        <div id="errors"></div>
        <form id="form">
          <div class="form-input">
            <label for="name">name</label>
            <input type="text" name="name" id="name" />
          </div>
          <div class="form-input">
            <label for="description">description</label>
            <input type="text" name="description" id="description" />
          </div>
          <div class="form-input">
            <label for="interests">interests</label>
            <input type="text" name="interests" id="interests" />
          </div>
          <div class="form-input">
            <label for="image-url">image url</label>
            <input type="text" name="url" id="image-url" />
          </div>
          <button id="submit" type="submit">Add Me!</button>
        </form>
      </div>
    </div>
  </body>
</html>
