<html lang="en">
  <head>
    <title>Super Hero Trading Cards</title>
    <script
      src="https://kit.fontawesome.com/8391330468.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat|Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="static/villain.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script type="text/javascript" src="static/villain.js"></script>
  </head>

  <body>
    <div class="header">
      <h1 class="pre-logo-title">Super Hero Trading Card App©</h1>
      <a href="/" class="logo"
        ><img
          src="https://thumbs.dreamstime.com/b/hand-pressing-red-button-comic-style-red-background-hand-pressing-red-button-comic-book-style-surrounded-dynamic-327704773.jpg"
          alt="Home"
      /></a>
      <div class="header-right">
        <a href="/add"><i class="fas fa-plus"></i> add card</a>
        <a href="/delete"><i class="fas fa-times"> </i> remove card</a>
      </div>
    </div>

    <div class="content"></div>

    <script>
      const container = document.querySelector(".content");

      fetch("/api/villains/")
        .then((res) => res.json())
        .then((data) => {
          // If DB is empty, use placeholders
          const villains = data.length
            ? data
            : [
                {
                  name: "Dr. Doom",
                  description:
                    "Doctor Doom, real name Victor Von Doom, is a genius inventor and sorcerer from Latveria. He dons a metal armor and mask, ruling his nation with iron-fisted control. Driven by intellect and ambition, he seeks ultimate power, often clashing with the Fantastic Four, blending science and dark magic.",
                  interests: "Conquering the world, SPF Creams",
                  url: "static/images/drdoom.png",
                  date_added: "2026-01-05",
                },
                {
                  name: "Mystique",
                  description:
                    "Mystique, aka Raven Darkhölme, is a master shapeshifter and skilled combatant in the Marvel Universe. She can mimic anyone’s appearance and voice, making her a cunning spy and mercenary. Loyal to mutant causes yet morally ambiguous, she often clashes with X-Men, using deception, strategy, and stealth to achieve her goals.",
                  interests: "Espionage, Hiking",
                  url: "https://www.looper.com/img/uploads/2016/06/mystiquefinalfeatured-780x438_rev1.jpg",
                  date_added: "2026-01-05",
                },
                {
                  name: "Joker",
                  description:
                    "The Joker is Gotham’s chaotic arch-nemesis of Batman, a criminal mastermind with a sadistic sense of humor. Known for his clown-like appearance, green hair, and maniacal laugh, he thrives on chaos, anarchy, and psychological torment, blending cunning intellect with unpredictability, making him one of the most dangerous and iconic villains in comics.",
                  interests: "Stand-up Comedy, Crime",
                  url: "https://i.pinimg.com/736x/18/57/c1/1857c1dd7c162052bc52de3fcf1cccfd.jpg",
                  date_added: "2026-01-05",
                },
                {
                  name: "Icon",
                  description:
                    "The superhero Icon, aka Augustus Freeman, is a nearly immortal alien who crash-landed on Earth in the 19th century. Possessing super strength, flight, and advanced intellect, he fights for justice while navigating human society. Icon often mentors younger heroes, blending cosmic power with wisdom and moral integrity",
                  interests: "Pranks, Sandwiches",
                  url: "https://i.redd.it/osok8xkcna271.jpg",
                  date_added: "2026-01-05",
                },
                {
                  name: "Storm",
                  description:
                    "Storm, real name Ororo Munroe, is a powerful mutant and member of the X-Men. She can control weather, summon lightning, wind, and rain, and fly. A skilled strategist and leader, Storm combines her powers with courage and compassion, often serving as a mentor and protector for mutantkind.",
                  interests: "Storm Chasing, Kite Surfing",
                  url: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcvQeW12UGKsiqfy-iPctGCFk2nLoNTmx3fw&s",
                  date_added: "2026-01-05",
                },
              ];

          villains.forEach((villain) => {
            const card = document.createElement("div");
            card.className = "card"; // this is key for CSS styling

            card.innerHTML = `
    <img src="${villain.url}" class="card-image" alt="${villain.name}" />
    <h2 class="card-name">${villain.name}</h2>
    <div class="card-body">
      <p class="card-description">${villain.description}</p>
      <h4>Interests</h4>
      <p class="card-interests">${villain.interests}</p>
      <p class="card-date-added">Date added: ${villain.date_added}</p>
    </div>
  `;

            container.appendChild(card);
          });
        })
        .catch((err) => console.error("Error fetching villains:", err));
    </script>
  </body>
</html>
