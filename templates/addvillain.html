<html lang="en">
  <head>
    <title>Add Villain | FemaleSuper Villains Trading Cards</title>
    <script
      src="https://kit.fontawesome.com/8391330468.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat|Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="static/villain.css" />
  </head>

  <body>
    <div class="header">
      <h1 class="visually-hidden">FemaleSuper Villains Trading Cards</h1>
      <a href="/" class="logo"
        ><img
          src="https://s3.amazonaws.com/media.skillcrush.com/skillcrush/wp-content/uploads/2019/09/superlogo.png"
          alt="logo"
      /></a>
      <div class="header-right">
        <a href="/add"><i class="fas fa-plus"></i> add card</a>
        <a href="/delete"><i class="fas fa-times"> </i> remove card</a>
      </div>
    </div>
    <div class="content">
      <div class="form">
        <h2>ADD A CARD</h2>
        <div id="errors">
          {% for error in errors %}
          <div class="error">{{ error }}</div>
          {% endfor %}
        </div>
        <form id="form" action="/addVillain" method="post">
          <div class="form-input">
            <label for="name">name</label>
            <input type="text" name="name" id="name" />
          </div>
          <div class="form-input">
            <label for="description">description</label>
            <input type="text" name="description" id="description" />
          </div>
          <div class="form-input">
            <label for="interests">interests</label>
            <input type="text" name="interests" id="interests" />
          </div>
          <div class="form-input">
            <label for="image-url">image url</label>
            <input type="text" name="url" id="image-url" />
          </div>
          <button id="submit" type="submit">Add Me!</button>
        </form>
      </div>
    </div>
  </body>
</html>
